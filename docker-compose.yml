x-sandbox-base: &sandbox-base
  build:
    context: .
    dockerfile: Dockerfile
  image: id-scam-pipeline-verifier:latest
  env_file:
    - path: .env
      required: false
  environment:
    - VERIFY_TIMEOUT_MS=${VERIFY_TIMEOUT_MS:-15000}
    - SCREENSHOT_JPEG_QUALITY=${SCREENSHOT_JPEG_QUALITY:-60}
  # Security & resource guardrails (NFR-SEC-001): no host volumes, read-only rootfs, <= 1 GB RAM
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=128m
  shm_size: 256m
  mem_limit: 1g
  memswap_limit: 1g
  cpus: "1.0"
  pids_limit: 256
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true

services:
  verifier:
    <<: *sandbox-base
    restart: "no"

  mock-target:
    <<: *sandbox-base
    entrypoint: ["uvicorn", "src.mock_target:app", "--host", "0.0.0.0", "--port", "8001"]
    ports:
      - "127.0.0.1:8001:8001"
    restart: unless-stopped

  dashboard:
    <<: *sandbox-base
    depends_on:
      - mock-target
    environment:
      - VERIFY_TIMEOUT_MS=${VERIFY_TIMEOUT_MS:-15000}
      - SCREENSHOT_JPEG_QUALITY=${SCREENSHOT_JPEG_QUALITY:-60}
      - SUBMIT_TARGET_URL=${SUBMIT_TARGET_URL:-http://mock-target:8001}
      - SUBMIT_LINKS_SELECTOR=${SUBMIT_LINKS_SELECTOR:-textarea[name="links"]}
      - SUBMIT_REPORTER_SELECTOR=${SUBMIT_REPORTER_SELECTOR:-input[name="reporter"]}
      - SUBMIT_BUTTON_SELECTOR=${SUBMIT_BUTTON_SELECTOR:-button[type="submit"]}
      - SUBMIT_SUCCESS_SELECTOR=${SUBMIT_SUCCESS_SELECTOR:-[data-submit-status="ok"]}
    entrypoint: ["uvicorn", "src.app:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped

  auto-worker:
    <<: *sandbox-base
    profiles: ["auto"]
    entrypoint: ["python3", "-m", "src.worker", "all"]
    restart: unless-stopped
